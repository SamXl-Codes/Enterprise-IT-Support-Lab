name: Offline test suite
on:
  push:
    paths:
      - 'itsupport_lab/**'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
